<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CardioPulse</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-xl shadow-md border border-slate-200 p-8">
    <h2 class="text-2xl font-bold text-slate-800 text-center mb-2">Login</h2>
    <p class="text-xs text-slate-500 text-center mb-6">Heart Disease Prediction System</p>

    <div id="alertMsg" class="hidden mb-4 p-3 rounded text-sm font-medium"></div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">User Name</label>
        <input type="text" name="user_name" required placeholder="Enter username or email"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
      </div>

      <div>
        <div class="flex items-center justify-between mb-1">
          <label class="block text-xs font-semibold text-slate-700">Password</label>
          <a href="/forget_password_page" class="text-xs text-sky-600 hover:underline">Forgot password?</a>
        </div>
        <input type="password" name="password" required placeholder="Enter password"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
      </div>

      <button type="submit" id="submitBtn"
        class="w-full py-2.5 bg-sky-600 hover:bg-sky-700 text-white font-semibold rounded-lg text-sm transition">
        Login
      </button>
    </form>

    <p class="text-xs text-center text-slate-500 mt-6">
      Don't have an account? 
      <a href="/register_page" class="text-sky-600 font-semibold hover:underline">Register here</a>
    </p>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const alertMsg = document.getElementById("alertMsg");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertMsg.classList.add("hidden");
      submitBtn.disabled = true;
      submitBtn.textContent = "Logging in...";

      const formData = new FormData(form);

      try {
        const response = await fetch("/login", {
          method: "POST",
          body: formData
        });
        const data = await response.json();

        if (data.status === "success") {
          // Store token and username
          localStorage.setItem("token", data.access_token);
          localStorage.setItem("user_name", data.user_name || formData.get("user_name"));
          window.location.href = "/prediction_page";
        } else {
          alertMsg.textContent = data.message || "Invalid credentials";
          alertMsg.className = "mb-4 p-3 rounded text-sm font-medium bg-red-50 text-red-700 border border-red-200";
          submitBtn.disabled = false;
          submitBtn.textContent = "Login";
        }
      } catch (err) {
        alertMsg.textContent = "Server error occurred. Please try again.";
        alertMsg.className = "mb-4 p-3 rounded text-sm font-medium bg-red-50 text-red-700 border border-red-200";
        submitBtn.disabled = false;
        submitBtn.textContent = "Login";
      }
    });
  </script>
</body>
</html>
