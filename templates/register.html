<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - CardioPulse</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-xl shadow-md border border-slate-200 p-8">
    <h2 class="text-2xl font-bold text-slate-800 text-center mb-2">Register</h2>
    <p class="text-xs text-slate-500 text-center mb-6">Create account for Heart Disease Prediction</p>

    <div id="alertMsg" class="hidden mb-4 p-3 rounded text-sm font-medium"></div>

    <form id="registerForm" class="space-y-3.5">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">User Name</label>
        <input type="text" name="user_name" required placeholder="Enter username"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Email ID</label>
        <input type="email" name="email_id" required placeholder="Enter email address"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Contact Number</label>
          <input type="text" name="contact_number" required placeholder="Contact phone"
            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Date of Birth</label>
          <input type="date" name="dob" required
            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
        <input type="password" name="password" required minlength="4" placeholder="Enter password"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
      </div>

      <button type="submit" id="submitBtn"
        class="w-full py-2.5 bg-sky-600 hover:bg-sky-700 text-white font-semibold rounded-lg text-sm transition mt-2">
        Register
      </button>
    </form>

    <p class="text-xs text-center text-slate-500 mt-6">
      Already have an account? 
      <a href="/login_page" class="text-sky-600 font-semibold hover:underline">Login here</a>
    </p>
  </div>

  <script>
    const form = document.getElementById("registerForm");
    const alertMsg = document.getElementById("alertMsg");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertMsg.classList.add("hidden");
      submitBtn.disabled = true;
      submitBtn.textContent = "Registering...";

      const formData = new FormData(form);

      try {
        const response = await fetch("/register", {
          method: "POST",
          body: formData
        });
        const data = await response.json();

        if (data.status === "success") {
          alert("Registration Successful! Please login.");
          window.location.href = "/login_page";
        } else {
          alertMsg.textContent = data.message || "Registration failed";
          alertMsg.className = "mb-4 p-3 rounded text-sm font-medium bg-red-50 text-red-700 border border-red-200 block";
          alertMsg.classList.remove("hidden");
          submitBtn.disabled = false;
          submitBtn.textContent = "Register";
        }
      } catch (err) {
        console.error("Registration error:", err);
        alertMsg.textContent = "Error: " + (err.message || "Could not register. Please try again.");
        alertMsg.className = "mb-4 p-3 rounded text-sm font-medium bg-red-50 text-red-700 border border-red-200 block";
        alertMsg.classList.remove("hidden");
        submitBtn.disabled = false;
        submitBtn.textContent = "Register";
      }
    });
  </script>
</body>
</html>
